[supervisord]
user=root
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
pidfile=/var/run/supervisord.pid

[program:init-storage]
command=/bin/sh -c "mkdir -p /var/www/html/storage/app/public/profile-pictures/male /var/www/html/storage/app/public/profile-pictures/female /var/www/html/storage/app/public/team-icons /var/www/html/storage/app/public/project-photos /var/www/html/storage/app/public/users /var/www/html/storage/app/private && cp -rn /var/www/html/public/assets/images/* /var/www/html/storage/app/public/ 2>/dev/null; php /var/www/html/artisan storage:link --force && chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache"
directory=/var/www/html
autostart=true
autorestart=false
startsecs=0
priority=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frankenphp]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/var/www/html
autostart=true
autorestart=true
priority=1
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/var/log/frankenphp_access.log
stdout_logfile_maxbytes=50MB
stderr_logfile=/var/log/frankenphp_error.log
stderr_logfile_maxbytes=50MB

[program:queue-runner]
command=php /var/www/html/artisan queue:work --tries=3 --timeout=320 --sleep=3
autostart=true
autorestart=true
priority=2
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[supervisorctl]

